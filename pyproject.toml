[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-classifier"
version = "1.0.0"
description = "EfficientNet-B0 transfer learning for 6-class scene classification"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
